<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouAgent | Agent Arena</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['JetBrains Mono', 'monospace'],
                        display: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            black: '#050505',
                            dark: '#0a0a0f',
                            panel: '#12121a',
                            cyan: '#00f3ff',
                            pink: '#ff00ff',
                            purple: '#bc13fe',
                            yellow: '#fcee0a',
                            dim: 'rgba(255, 255, 255, 0.1)',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scanline': 'scanline 8s linear infinite',
                        'glitch': 'glitch 1s linear infinite',
                    },
                    keyframes: {
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' }
                        },
                        glitch: {
                            '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                            '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                            '62%': { transform: 'translate(0,0) skew(5deg)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        
        /* Custom scrollbar for terminal */
        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-track { background: #000; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #333; }
        
        .clip-angle {
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
    </style>
</head>
<body x-data="arenaApp()" class="bg-cyber-black text-white h-screen flex flex-col overflow-hidden selection:bg-cyber-cyan selection:text-black">

    <!-- Header -->
    <div class="h-16 border-b border-cyber-dim flex justify-between items-center px-6 bg-cyber-panel z-50 shrink-0">
        <div class="flex items-center gap-2">
            <h1 class="font-display font-bold text-xl tracking-widest text-white">YouAgent <span class="text-cyber-cyan">ARENA</span></h1>
        </div>
        <a href="index.html" class="text-xs font-mono text-gray-400 hover:text-white transition-colors flex items-center gap-2 border border-cyber-dim px-3 py-1 rounded hover:border-cyber-cyan">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            RETURN TO NEXUS
        </a>
    </div>

    <!-- Main Battle Area -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- CRT Scanline Effect -->
        <div class="absolute inset-0 crt-overlay z-40"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-cyber-cyan/5 to-transparent animate-scanline z-30 opacity-20 pointer-events-none"></div>

        <!-- VS Badge (Center) -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col items-center pointer-events-none">
            <div class="w-24 h-24 bg-black border-2 border-white transform rotate-45 flex items-center justify-center shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                <span class="font-display font-black text-4xl transform -rotate-45" 
                      :class="status === 'fighting' ? 'animate-pulse text-cyber-yellow' : 'text-white'">VS</span>
            </div>
            <div x-show="status === 'finished'" x-transition class="mt-12 bg-black/90 backdrop-blur border border-cyber-yellow text-cyber-yellow px-6 py-2 font-mono text-xs uppercase tracking-widest rounded shadow-[0_0_20px_rgba(252,238,10,0.3)]">
                SIMULATION COMPLETE
            </div>
        </div>

        <!-- PLAYER 1 (LEFT) -->
        <div class="w-1/2 border-r border-cyber-dim relative flex flex-col bg-cyber-dark/30 transition-all duration-500"
             :class="winner === 'A' ? 'shadow-[inset_0_0_100px_rgba(0,243,255,0.1)] bg-cyber-cyan/5' : (winner === 'B' ? 'opacity-30 grayscale' : '')">
            
            <!-- Header / Select -->
            <div class="p-6 border-b border-cyber-dim/50 flex justify-between items-start bg-black/20">
                <div class="w-full mr-4">
                    <div class="text-[10px] font-mono text-cyber-cyan mb-1 tracking-wider">CHALLENGER [A]</div>
                    <select x-model="agentA" @change="reset()" class="bg-transparent text-2xl md:text-3xl font-display font-bold text-white outline-none border-b border-transparent hover:border-cyber-cyan cursor-pointer appearance-none uppercase w-full py-1">
                        <template x-for="agent in db" :key="agent.id">
                            <option :value="agent.id" x-text="agent.name" :selected="agent.id === agentA" class="bg-cyber-black text-base"></option>
                        </template>
                    </select>
                </div>
                <div class="w-3 h-3 bg-cyber-cyan rounded-full shadow-[0_0_10px_#00f3ff] mt-2"></div>
            </div>

            <!-- Content Area -->
            <div class="flex-1 p-6 overflow-hidden flex flex-col relative">
                <!-- Background visual -->
                <div class="absolute inset-0 opacity-20 z-0">
                    <img :src="getAgent(agentA).video_poster" class="w-full h-full object-cover grayscale mix-blend-screen">
                </div>
                
                <!-- Metrics Overlay -->
                <div class="relative z-10 grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-black/70 backdrop-blur border border-cyber-cyan/30 p-3 clip-angle">
                        <div class="text-[10px] text-gray-400 font-mono mb-1">TOKENS/SEC</div>
                        <div class="text-xl font-mono text-cyber-cyan font-bold" x-text="metricsA.tokens">0</div>
                    </div>
                    <div class="bg-black/70 backdrop-blur border border-cyber-cyan/30 p-3 clip-angle">
                        <div class="text-[10px] text-gray-400 font-mono mb-1">LOGIC DEPTH</div>
                        <div class="text-xl font-mono text-cyber-cyan font-bold" x-text="metricsA.depth + '%'">0%</div>
                    </div>
                </div>

                <!-- Terminal / Output -->
                <div class="flex-1 bg-black/80 border border-cyber-dim/50 p-4 font-mono text-xs overflow-y-auto terminal-scroll relative shadow-inner">
                    
                    <!-- Idle State -->
                    <div x-show="status === 'idle'" class="text-gray-500 h-full flex items-center justify-center">
                        <div class="text-center">
                            <p class="animate-pulse">SYSTEM READY</p>
                            <p class="text-[10px] mt-2 opacity-50">WAITING FOR INPUT...</p>
                        </div>
                    </div>

                    <!-- Fighting State (Logs) -->
                    <div x-show="status === 'fighting'" class="space-y-1.5 text-cyber-cyan/80">
                        <template x-for="log in logsA">
                            <div class="flex gap-2">
                                <span class="opacity-50">>></span>
                                <span x-text="log"></span>
                            </div>
                        </template>
                        <div class="animate-pulse text-cyber-cyan">_</div>
                    </div>

                    <!-- Finished State (Response) -->
                    <div x-show="status === 'finished'" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 translate-y-4" class="space-y-4">
                        <div x-show="winner === 'A'" class="inline-block px-3 py-1 bg-cyber-cyan text-black font-bold text-[10px] tracking-widest clip-angle">WINNER</div>
                        <p class="text-white leading-relaxed border-l-2 border-cyber-cyan pl-4" x-text="responseA"></p>
                        <div class="text-[10px] text-gray-500 border-t border-gray-800 pt-3 mt-4 flex justify-between">
                            <span>Final Latency</span>
                            <span class="text-cyber-cyan font-bold" x-text="metricsA.latency + 'ms'"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PLAYER 2 (RIGHT) -->
        <div class="w-1/2 relative flex flex-col bg-cyber-dark/30 transition-all duration-500"
             :class="winner === 'B' ? 'shadow-[inset_0_0_100px_rgba(255,0,255,0.1)] bg-cyber-pink/5' : (winner === 'A' ? 'opacity-30 grayscale' : '')">
             
            <!-- Header / Select -->
            <div class="p-6 border-b border-cyber-dim/50 flex justify-between items-start flex-row-reverse text-right bg-black/20">
                <div class="w-full ml-4">
                    <div class="text-[10px] font-mono text-cyber-pink mb-1 tracking-wider">OPPONENT [B]</div>
                    <select x-model="agentB" @change="reset()" class="bg-transparent text-2xl md:text-3xl font-display font-bold text-white outline-none border-b border-transparent hover:border-cyber-pink cursor-pointer appearance-none uppercase w-full py-1 text-right" dir="rtl">
                        <template x-for="agent in db" :key="agent.id">
                            <option :value="agent.id" x-text="agent.name" :selected="agent.id === agentB" class="bg-cyber-black text-left"></option>
                        </template>
                    </select>
                </div>
                <div class="w-3 h-3 bg-cyber-pink rounded-full shadow-[0_0_10px_#ff00ff] mt-2"></div>
            </div>

            <!-- Content Area -->
            <div class="flex-1 p-6 overflow-hidden flex flex-col relative">
                <!-- Background visual -->
                <div class="absolute inset-0 opacity-20 z-0">
                    <img :src="getAgent(agentB).video_poster" class="w-full h-full object-cover grayscale mix-blend-screen">
                </div>
                
                <!-- Metrics Overlay -->
                <div class="relative z-10 grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-black/70 backdrop-blur border border-cyber-pink/30 p-3 clip-angle">
                        <div class="text-[10px] text-gray-400 font-mono mb-1">TOKENS/SEC</div>
                        <div class="text-xl font-mono text-cyber-pink font-bold" x-text="metricsB.tokens">0</div>
                    </div>
                    <div class="bg-black/70 backdrop-blur border border-cyber-pink/30 p-3 clip-angle">
                        <div class="text-[10px] text-gray-400 font-mono mb-1">LOGIC DEPTH</div>
                        <div class="text-xl font-mono text-cyber-pink font-bold" x-text="metricsB.depth + '%'">0%</div>
                    </div>
                </div>

                <!-- Terminal / Output -->
                <div class="flex-1 bg-black/80 border border-cyber-dim/50 p-4 font-mono text-xs overflow-y-auto terminal-scroll relative shadow-inner">
                     <!-- Idle State -->
                     <div x-show="status === 'idle'" class="text-gray-500 h-full flex items-center justify-center">
                        <div class="text-center">
                            <p class="animate-pulse">SYSTEM READY</p>
                            <p class="text-[10px] mt-2 opacity-50">WAITING FOR INPUT...</p>
                        </div>
                    </div>

                    <!-- Fighting State (Logs) -->
                    <div x-show="status === 'fighting'" class="space-y-1.5 text-cyber-pink/80">
                        <template x-for="log in logsB">
                            <div class="flex gap-2">
                                <span class="opacity-50">>></span>
                                <span x-text="log"></span>
                            </div>
                        </template>
                        <div class="animate-pulse text-cyber-pink">_</div>
                    </div>

                    <!-- Finished State (Response) -->
                    <div x-show="status === 'finished'" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 translate-y-4" class="space-y-4">
                        <div x-show="winner === 'B'" class="inline-block px-3 py-1 bg-cyber-pink text-black font-bold text-[10px] tracking-widest clip-angle">WINNER</div>
                        <p class="text-white leading-relaxed border-l-2 border-cyber-pink pl-4" x-text="responseB"></p>
                        <div class="text-[10px] text-gray-500 border-t border-gray-800 pt-3 mt-4 flex justify-between">
                            <span>Final Latency</span>
                            <span class="text-cyber-pink font-bold" x-text="metricsB.latency + 'ms'"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="h-auto min-h-[100px] bg-cyber-panel border-t border-cyber-dim p-6 flex flex-col md:flex-row items-center gap-4 z-50 shrink-0">
        <div class="flex-1 w-full relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <span class="text-cyber-cyan font-bold animate-pulse">></span>
            </div>
            <input type="text" x-model="prompt" 
                   class="w-full bg-black/50 border border-cyber-dim rounded py-4 pl-10 pr-4 text-white font-mono focus:border-cyber-cyan focus:bg-black focus:outline-none focus:ring-1 focus:ring-cyber-cyan transition-all placeholder-gray-600" 
                   placeholder="Enter challenge prompt (e.g., 'Optimize this Python recursion function')..."
                   @keydown.enter="status === 'idle' && startBattle()">
        </div>
        <button @click="startBattle()" 
                :disabled="status === 'fighting' || !prompt"
                class="w-full md:w-auto px-10 py-4 bg-white text-black font-display font-black tracking-widest hover:bg-cyber-cyan hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 clip-angle shadow-[0_0_20px_rgba(255,255,255,0.2)]">
            <span x-text="status === 'fighting' ? 'PROCESSING...' : (status === 'finished' ? 'REMATCH' : 'FIGHT')"></span>
        </button>
    </div>

    <!-- Logic -->
    <script>
        const DB = [
            { id: 'gpt4', name: 'GPT-4 Omni', video_poster: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?q=80&w=1000&auto=format&fit=crop' },
            { id: 'claude3', name: 'Claude 3 Opus', video_poster: 'https://images.unsplash.com/photo-1614726365723-49cfae90ecfc?q=80&w=1000&auto=format&fit=crop' },
            { id: 'mj-v6', name: 'Midjourney v6', video_poster: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop' },
            { id: 'runway', name: 'Runway Gen-3', video_poster: 'https://images.unsplash.com/photo-1535016120720-40c6874c3b13?q=80&w=1000&auto=format&fit=crop' },
            { id: 'copilot', name: 'GitHub Copilot', video_poster: 'https://images.unsplash.com/photo-1618401471353-b98afee0b2eb?q=80&w=1000&auto=format&fit=crop' },
            { id: 'mistral', name: 'Mistral Large', video_poster: 'https://images.unsplash.com/photo-1605810230434-7631ac76ec81?q=80&w=1000&auto=format&fit=crop' }
        ];

        function arenaApp() {
            return {
                db: DB,
                agentA: 'gpt4',
                agentB: 'claude3',
                prompt: '',
                status: 'idle', // idle, fighting, finished
                winner: null,
                
                // State for Agent A
                metricsA: { tokens: 0, depth: 0, latency: 0 },
                logsA: [],
                responseA: '',
                
                // State for Agent B
                metricsB: { tokens: 0, depth: 0, latency: 0 },
                logsB: [],
                responseB: '',
                
                intervals: [],

                getAgent(id) {
                    return this.db.find(a => a.id === id) || this.db[0];
                },

                reset() {
                    this.status = 'idle';
                    this.winner = null;
                    this.metricsA = { tokens: 0, depth: 0, latency: 0 };
                    this.metricsB = { tokens: 0, depth: 0, latency: 0 };
                    this.logsA = [];
                    this.logsB = [];
                },

                startBattle() {
                    if(!this.prompt) return;
                    this.reset();
                    this.status = 'fighting';

                    // Simulate Latency
                    this.metricsA.latency = Math.floor(Math.random() * 200) + 50;
                    this.metricsB.latency = Math.floor(Math.random() * 200) + 50;

                    // Start Simulation Loop
                    const simInterval = setInterval(() => {
                        // Randomize metrics
                        this.metricsA.tokens = Math.floor(Math.random() * 50) + 10;
                        this.metricsB.tokens = Math.floor(Math.random() * 50) + 10;
                        
                        this.metricsA.depth += Math.floor(Math.random() * 5);
                        if(this.metricsA.depth > 100) this.metricsA.depth = 100;
                        
                        this.metricsB.depth += Math.floor(Math.random() * 5);
                        if(this.metricsB.depth > 100) this.metricsB.depth = 100;

                        // Add fake logs
                        const techBabble = ['Injecting Vectors...', 'Parsing Context Window...', 'Optimizing Tensor Float...', 'Reducing Hallucination...', 'Querying Knowledge Graph...', 'Allocating GPU Cluster...', 'Fetching Embeddings...'];
                        const hex = '0x' + Math.floor(Math.random()*16777215).toString(16);
                        
                        this.logsA.push(`[${hex}] ${techBabble[Math.floor(Math.random() * techBabble.length)]}`);
                        if(this.logsA.length > 8) this.logsA.shift();
                        
                        this.logsB.push(`[${hex}] ${techBabble[Math.floor(Math.random() * techBabble.length)]}`);
                        if(this.logsB.length > 8) this.logsB.shift();

                    }, 150);

                    this.intervals.push(simInterval);

                    // End Battle after 3 seconds
                    setTimeout(() => {
                        this.finishBattle(simInterval);
                    }, 3000);
                },

                finishBattle(interval) {
                    clearInterval(interval);
                    this.status = 'finished';
                    
                    // Generate Logic
                    const isALonger = Math.random() > 0.5;
                    const responsesA_List = [
                        "Analysis complete. Based on the provided parameters, the optimal solution involves a recursive approach to the data structure. The complexity is reduced by O(n) using this method.",
                        "I have successfully refactored the codebase. Logic density improved by 14%. Unit tests passed."
                    ];
                    const responsesB_List = [
                         "Here is the result: 42. It is the most efficient answer.",
                         "Done. Output generated in 0.4s. The probability of error is < 0.01%."
                    ];

                    this.responseA = isALonger ? responsesA_List[0] : responsesA_List[1];
                    this.responseB = !isALonger ? responsesA_List[0] : responsesB_List[1]; // Mix up responses

                    // Determine Winner (Random for now)
                    const scoreA = this.metricsA.tokens + this.metricsA.depth;
                    const scoreB = this.metricsB.tokens + this.metricsB.depth;
                    
                    // Simple animation delay for suspense
                    setTimeout(() => {
                         this.winner = scoreA > scoreB ? 'A' : 'B';
                    }, 200);
                }
            }
        }
    </script>
</body>
</html>
